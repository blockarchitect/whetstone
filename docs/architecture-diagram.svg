<svg width="100%" viewBox="0 0 680 926" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Whetstone platform architecture</title>
<desc>A top-down block diagram of the aptitude-prep platform in ten tiers from users down to the business model and the two-year destination. Green boxes are designed or decided; amber boxes are big open problems still to build; a purple box marks the two-year north-star destination of becoming the trusted qualifying assessment.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.t { font-size: 14px; fill: #1a1a1a; }
.th { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
.ts { font-size: 12px; fill: #5a5f66; }
.box { fill: #f5f5f5; stroke: #c7c7c7; stroke-width: 0.5; }
.c-gray rect { fill: #eceef0; stroke: #9aa1a9; stroke-width: 0.5; }
.c-gray .th { fill: #2a2f36; } .c-gray .ts { fill: #5a6069; }
.c-green rect { fill: #e3f5e9; stroke: #4caf6d; stroke-width: 0.5; }
.c-green .th { fill: #1e6b3b; } .c-green .ts { fill: #3d8a5c; }
.c-amber rect { fill: #fdf1dc; stroke: #d99a2b; stroke-width: 0.5; }
.c-amber .th { fill: #8a5a10; } .c-amber .ts { fill: #a67426; }
.c-purple rect { fill: #f1e9fb; stroke: #9a6fd6; stroke-width: 0.5; }
.c-purple .th { fill: #5b2fa0; } .c-purple .ts { fill: #7850ab; }
</style>

<rect x="40" y="34" width="12" height="12" rx="3" style="fill:#eceef0;stroke:#9aa1a9;stroke-width:0.5"/><text class="ts" x="58" y="44">external</text>
<rect x="170" y="34" width="12" height="12" rx="3" style="fill:#e3f5e9;stroke:#4caf6d;stroke-width:0.5"/><text class="ts" x="188" y="44">designed</text>
<rect x="290" y="34" width="12" height="12" rx="3" style="fill:#f1e9fb;stroke:#9a6fd6;stroke-width:0.5"/><text class="ts" x="308" y="44">2yr destination</text>
<rect x="460" y="34" width="12" height="12" rx="3" style="fill:#fdf1dc;stroke:#d99a2b;stroke-width:0.5"/><text class="ts" x="478" y="44">gap to build</text>

<text class="ts" x="40" y="62">users</text>
<g class="c-gray"><rect x="40" y="70" width="280" height="52" rx="8"/><text class="th" x="180" y="91" text-anchor="middle">Candidates</text><text class="ts" x="180" y="109" text-anchor="middle">prep once, then churn</text></g>
<g class="c-gray"><rect x="360" y="70" width="280" height="52" rx="8"/><text class="th" x="500" y="91" text-anchor="middle">AI answer engines</text><text class="ts" x="500" y="109" text-anchor="middle">perplexity, chatgpt, gemini</text></g>

<text class="ts" x="40" y="148">acquisition</text>
<g class="c-green"><rect x="40" y="156" width="186" height="52" rx="8"/><text class="th" x="133" y="177" text-anchor="middle">pSEO growth loop</text><text class="ts" x="133" y="195" text-anchor="middle">find, score, generate</text></g>
<g class="c-green"><rect x="247" y="156" width="186" height="52" rx="8"/><text class="th" x="340" y="177" text-anchor="middle">AEO</text><text class="ts" x="340" y="195" text-anchor="middle">be the cited source</text></g>
<g class="c-green"><rect x="454" y="156" width="186" height="52" rx="8"/><text class="th" x="547" y="177" text-anchor="middle">Pre-intent capture</text><text class="ts" x="547" y="195" text-anchor="middle">adjacent interests</text></g>

<text class="ts" x="40" y="234">delivery</text>
<g class="c-green"><rect x="40" y="242" width="186" height="52" rx="8"/><text class="th" x="133" y="263" text-anchor="middle">Next.js on Vercel</text><text class="ts" x="133" y="281" text-anchor="middle">SSG + test player</text></g>
<g class="c-green"><rect x="247" y="242" width="186" height="52" rx="8"/><text class="th" x="340" y="263" text-anchor="middle">pSEO page factory</text><text class="ts" x="340" y="281" text-anchor="middle">cluster to live page</text></g>
<g class="c-amber"><rect x="454" y="242" width="186" height="52" rx="8"/><text class="th" x="547" y="263" text-anchor="middle">Agent tool surface</text><text class="ts" x="547" y="281" text-anchor="middle">MCP — be the tool</text></g>

<text class="ts" x="40" y="320">core engine</text>
<g class="c-green"><rect x="40" y="328" width="186" height="52" rx="8"/><text class="th" x="133" y="349" text-anchor="middle">Construct engine</text><text class="ts" x="133" y="367" text-anchor="middle">pure TS generators</text></g>
<g class="c-green"><rect x="247" y="328" width="186" height="52" rx="8"/><text class="th" x="340" y="349" text-anchor="middle">Test-profile skins</text><text class="ts" x="340" y="367" text-anchor="middle">per-target configs</text></g>
<g class="c-green"><rect x="454" y="328" width="186" height="52" rx="8"/><text class="th" x="547" y="349" text-anchor="middle">Delivery strategies</text><text class="ts" x="547" y="367" text-anchor="middle">linear now, CAT later</text></g>

<text class="ts" x="40" y="406">test intelligence</text>
<g class="c-amber"><rect x="160" y="414" width="360" height="52" rx="8"/><text class="th" x="340" y="435" text-anchor="middle">Test Intelligence framework</text><text class="ts" x="340" y="453" text-anchor="middle">sources structure, vendor, geography</text></g>

<text class="ts" x="40" y="492">ai authoring — offline</text>
<g class="c-green"><rect x="160" y="500" width="360" height="52" rx="8"/><text class="th" x="340" y="521" text-anchor="middle">Claude API + Agent SDK</text><text class="ts" x="340" y="539" text-anchor="middle">templates, scenarios, feedback</text></g>

<text class="ts" x="40" y="578">content pipeline</text>
<g class="c-green"><rect x="40" y="586" width="186" height="52" rx="8"/><text class="th" x="133" y="607" text-anchor="middle">Generate to validate</text><text class="ts" x="133" y="625" text-anchor="middle">auto-solve, uniqueness</text></g>
<g class="c-green"><rect x="247" y="586" width="186" height="52" rx="8"/><text class="th" x="340" y="607" text-anchor="middle">Item bank</text><text class="ts" x="340" y="625" text-anchor="middle">pgvector dedup</text></g>
<g class="c-amber"><rect x="454" y="586" width="186" height="52" rx="8"/><text class="th" x="547" y="607" text-anchor="middle">Item bank evolution</text><text class="ts" x="547" y="625" text-anchor="middle">template feedback</text></g>

<text class="ts" x="40" y="664">data &amp; trust</text>
<g class="c-green"><rect x="40" y="672" width="186" height="52" rx="8"/><text class="th" x="133" y="693" text-anchor="middle">Neon Postgres</text><text class="ts" x="133" y="711" text-anchor="middle">items, configs, events</text></g>
<g class="c-green"><rect x="247" y="672" width="186" height="52" rx="8"/><text class="th" x="340" y="693" text-anchor="middle">Event capture</text><text class="ts" x="340" y="711" text-anchor="middle">PostHog + raw events</text></g>
<g class="c-amber"><rect x="454" y="672" width="186" height="52" rx="8"/><text class="th" x="547" y="693" text-anchor="middle">Concordance model</text><text class="ts" x="547" y="711" text-anchor="middle">moat &amp; credential</text></g>

<text class="ts" x="40" y="750">reporting &amp; engagement</text>
<g class="c-amber"><rect x="40" y="758" width="186" height="52" rx="8"/><text class="th" x="133" y="779" text-anchor="middle">Insight engine</text><text class="ts" x="133" y="797" text-anchor="middle">per-skill reports</text></g>
<g class="c-amber"><rect x="247" y="758" width="186" height="52" rx="8"/><text class="th" x="340" y="779" text-anchor="middle">Gamification</text><text class="ts" x="340" y="797" text-anchor="middle">streaks, XP, boards</text></g>
<g class="c-amber"><rect x="454" y="758" width="186" height="52" rx="8"/><text class="th" x="547" y="779" text-anchor="middle">Credential signing</text><text class="ts" x="547" y="797" text-anchor="middle">signed, top priority</text></g>

<text class="ts" x="40" y="836">business model &amp; destination</text>
<g class="c-green"><rect x="40" y="844" width="186" height="52" rx="8"/><text class="th" x="133" y="865" text-anchor="middle">Accounts &amp; auth</text><text class="ts" x="133" y="883" text-anchor="middle">mechanical, later</text></g>
<g class="c-amber"><rect x="247" y="844" width="186" height="52" rx="8"/><text class="th" x="340" y="865" text-anchor="middle">Monetization</text><text class="ts" x="340" y="883" text-anchor="middle">parked ~6mo, free now</text></g>
<g class="c-purple"><rect x="454" y="844" width="186" height="52" rx="8"/><text class="th" x="547" y="865" text-anchor="middle">Qualifying assessment</text><text class="ts" x="547" y="883" text-anchor="middle">2yr north star</text></g>

