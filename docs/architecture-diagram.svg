<line x1="340" y1="556" x2="340" y2="583" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="642" x2="340" y2="669" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="728" x2="340" y2="755" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="814" x2="340" y2="841" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
