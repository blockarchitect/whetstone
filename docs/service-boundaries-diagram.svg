<svg width="100%" viewBox="0 0 680 324" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Whetstone service boundaries</title>
<desc>A repo/service topology diagram showing three independent apps — Platform, Content engine, Growth engine — connected by a shared Zod schemas package, each owning its own Postgres schema. Content engine and Growth engine are designed to be reusable across future products; Platform is Whetstone-specific.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; fill: #5a5f66; }
.c-blue rect { fill: #e3edfb; stroke: #4c8ec9; stroke-width: 0.5; }
.c-blue .th { fill: #0c447c; } .c-blue .ts { fill: #3d6a8a; }
.c-teal rect { fill: #e0f5f3; stroke: #3fae9e; stroke-width: 0.5; }
.c-teal .th { fill: #0f5f54; } .c-teal .ts { fill: #2d7e70; }
.c-purple rect { fill: #f1e9fb; stroke: #9a6fd6; stroke-width: 0.5; }
.c-purple .th { fill: #5b2fa0; } .c-purple .ts { fill: #7850ab; }
.c-gray rect { fill: #eceef0; stroke: #9aa1a9; stroke-width: 0.5; }
.c-gray .th { fill: #2a2f36; } .c-gray .ts { fill: #5a6069; }
</style>

<rect x="40" y="34" width="12" height="12" rx="3" style="fill:#e3edfb;stroke:#4c8ec9;stroke-width:0.5"/><text class="ts" x="58" y="44">Whetstone-specific</text>
<rect x="220" y="34" width="12" height="12" rx="3" style="fill:#e0f5f3;stroke:#3fae9e;stroke-width:0.5"/><text class="ts" x="238" y="44">reusable across products</text>
<rect x="450" y="34" width="12" height="12" rx="3" style="fill:#f1e9fb;stroke:#9a6fd6;stroke-width:0.5"/><text class="ts" x="468" y="44">shared contract</text>

<text class="ts" x="40" y="62">apps — independently deployable</text>
<g class="c-blue"><rect x="40" y="70" width="186" height="52" rx="8"/><text class="th" x="133" y="91" text-anchor="middle">Platform</text><text class="ts" x="133" y="109" text-anchor="middle">Whetstone-specific</text></g>
<g class="c-teal"><rect x="247" y="70" width="186" height="52" rx="8"/><text class="th" x="340" y="91" text-anchor="middle">Content engine</text><text class="ts" x="340" y="109" text-anchor="middle">reusable, any product</text></g>
<g class="c-teal"><rect x="454" y="70" width="186" height="52" rx="8"/><text class="th" x="547" y="91" text-anchor="middle">Growth engine</text><text class="ts" x="547" y="109" text-anchor="middle">reusable, any product</text></g>

<line x1="226" y1="96" x2="247" y2="96" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="433" y1="96" x2="454" y2="96" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<text class="ts" x="40" y="148">shared type contract — compile-time only, no shared logic</text>
<g class="c-purple"><rect x="40" y="156" width="600" height="52" rx="8"/><text class="th" x="340" y="177" text-anchor="middle">Shared schemas (Zod)</text><text class="ts" x="340" y="195" text-anchor="middle">the contract every service compiles against</text></g>

<line x1="133" y1="126" x2="133" y2="153" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="126" x2="340" y2="153" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="547" y1="126" x2="547" y2="153" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<text class="ts" x="40" y="234">data — each app owns its own schema</text>
<g class="c-gray"><rect x="40" y="242" width="186" height="52" rx="8"/><text class="th" x="133" y="263" text-anchor="middle">platform schema</text><text class="ts" x="133" y="281" text-anchor="middle">Postgres · Neon</text></g>
<g class="c-gray"><rect x="247" y="242" width="186" height="52" rx="8"/><text class="th" x="340" y="263" text-anchor="middle">content schema</text><text class="ts" x="340" y="281" text-anchor="middle">Postgres · Neon</text></g>
<g class="c-gray"><rect x="454" y="242" width="186" height="52" rx="8"/><text class="th" x="547" y="263" text-anchor="middle">growth schema</text><text class="ts" x="547" y="281" text-anchor="middle">Postgres · Neon</text></g>

<line x1="133" y1="212" x2="133" y2="239" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="212" x2="340" y2="239" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="547" y1="212" x2="547" y2="239" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
</svg>
