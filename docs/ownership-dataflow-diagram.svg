<svg width="100%" viewBox="0 0 680 536" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Whetstone ownership and data flow</title>
<desc>Three parent containers by app ownership: Growth Engine, Content Engine, Platform, each with its modules nested inside. Solid arrows show the forward build flow: Growth Engine decides what to build, Content Engine builds it, Platform delivers it. Dashed arrows show the backward measurement flow: Platform's captured events split, flowing to Content Engine for calibration and to Growth Engine for traffic measurement.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.t { font-size: 14px; fill: #2a2f36; }
.th { font-size: 14px; font-weight: 600; }
.ts { font-size: 12px; fill: #5a5f66; }
.c-blue rect { fill: #e3edfb; stroke: #4c8ec9; stroke-width: 0.5; }
.c-blue .th { fill: #0c447c; } .c-blue .ts { fill: #3d6a8a; }
.c-teal rect { fill: #e0f5f3; stroke: #3fae9e; stroke-width: 0.5; }
.c-teal .th { fill: #0f5f54; } .c-teal .ts { fill: #2d7e70; }
.c-purple rect { fill: #f1e9fb; stroke: #9a6fd6; stroke-width: 0.5; }
.c-purple .th { fill: #5b2fa0; } .c-purple .ts { fill: #7850ab; }
.c-gray rect { fill: #eceef0; stroke: #9aa1a9; stroke-width: 0.5; }
</style>

<line x1="40" y1="38" x2="64" y2="38" stroke="#8a8f98" stroke-width="1.5"/><text class="ts" x="72" y="42">build flow (forward)</text>
<line x1="240" y1="38" x2="264" y2="38" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4,3"/><text class="ts" x="272" y="42">measurement flow (back)</text>

<g class="c-blue"><rect x="30" y="60" width="620" height="94" rx="10"/><text class="th" x="340" y="78" text-anchor="middle">GROWTH ENGINE</text><text class="ts" x="340" y="94" text-anchor="middle">decides what to build · reusable across products</text></g>
<g class="c-gray"><rect x="56" y="106" width="133" height="36" rx="6"/><text class="t" x="122" y="128" text-anchor="middle">pSEO loop</text></g>
<g class="c-gray"><rect x="201" y="106" width="133" height="36" rx="6"/><text class="t" x="267" y="128" text-anchor="middle">AEO</text></g>
<g class="c-gray"><rect x="346" y="106" width="133" height="36" rx="6"/><text class="t" x="412" y="128" text-anchor="middle">Pre-intent</text></g>
<g class="c-gray"><rect x="491" y="106" width="133" height="36" rx="6"/><text class="t" x="557" y="128" text-anchor="middle">Distribution</text></g>

<line x1="340" y1="158" x2="340" y2="181" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="30" y="184" width="620" height="146" rx="10"/><text class="th" x="340" y="202" text-anchor="middle">CONTENT ENGINE</text><text class="ts" x="340" y="218" text-anchor="middle">builds &amp; calibrates · reusable across products</text></g>
<g class="c-gray"><rect x="56" y="230" width="180" height="36" rx="6"/><text class="t" x="146" y="252" text-anchor="middle">Constructs</text></g>
<g class="c-gray"><rect x="248" y="230" width="180" height="36" rx="6"/><text class="t" x="338" y="252" text-anchor="middle">Test intel</text></g>
<g class="c-gray"><rect x="440" y="230" width="180" height="36" rx="6"/><text class="t" x="530" y="252" text-anchor="middle">Item bank</text></g>
<g class="c-gray"><rect x="154" y="278" width="180" height="36" rx="6"/><text class="t" x="244" y="300" text-anchor="middle">Calibration</text></g>
<g class="c-gray"><rect x="346" y="278" width="180" height="36" rx="6"/><text class="t" x="436" y="300" text-anchor="middle">Concordance</text></g>

<line x1="340" y1="334" x2="340" y2="357" stroke="#8a8f98" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<line x1="200" y1="357" x2="200" y2="333" stroke="#8a8f98" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="30" y="360" width="620" height="146" rx="10"/><text class="th" x="340" y="378" text-anchor="middle">PLATFORM</text><text class="ts" x="340" y="394" text-anchor="middle">delivers · Whetstone-specific</text></g>
<g class="c-gray"><rect x="56" y="406" width="133" height="36" rx="6"/><text class="t" x="122" y="428" text-anchor="middle">Test player</text></g>
<g class="c-gray"><rect x="201" y="406" width="133" height="36" rx="6"/><text class="t" x="267" y="428" text-anchor="middle">pSEO pages</text></g>
<g class="c-gray"><rect x="346" y="406" width="133" height="36" rx="6"/><text class="t" x="412" y="428" text-anchor="middle">Reporting</text></g>
<g class="c-gray"><rect x="491" y="406" width="133" height="36" rx="6"/><text class="t" x="557" y="428" text-anchor="middle">Gamification</text></g>
<g class="c-gray"><rect x="56" y="454" width="133" height="36" rx="6"/><text class="t" x="122" y="476" text-anchor="middle">Credentials</text></g>
<g class="c-gray"><rect x="201" y="454" width="133" height="36" rx="6"/><text class="t" x="267" y="476" text-anchor="middle">Accounts</text></g>
<g class="c-gray"><rect x="346" y="454" width="133" height="36" rx="6"/><text class="t" x="412" y="476" text-anchor="middle">Event capture</text></g>
<g class="c-gray"><rect x="491" y="454" width="133" height="36" rx="6"/><text class="t" x="557" y="476" text-anchor="middle">Agent surface</text></g>

<path d="M 630 400 L 662 400 L 662 100 L 630 100" fill="none" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
</svg>
