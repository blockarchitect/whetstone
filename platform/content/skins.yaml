    displayName: "SHL-Style Aptitude Practice Test"
    tier: publisher
    companyOrPublisherName: "SHL"
    disclaimer: >-
      This is an independent practice test. It is not affiliated with, endorsed
      by, or connected to SHL. All questions are original and are designed to
      resemble the general style of the assessment, not to reproduce it.
    timeLimitMinutes: 12
    seoDescription: >-
      Free SHL-style aptitude practice test with numerical, verbal and logical
      reasoning questions and full worked answers.
