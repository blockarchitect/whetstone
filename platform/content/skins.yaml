# ============================================================
#  Whetstone test profiles (skins) — 12 UK launch tests
#  Each skin is a CONFIG over the shared item pool (content/items.yaml),
#  not its own question set. A new "test" = a new entry here (D3/D26).
#
#  disclaimer is REQUIRED on every named skin (D26 legal requirement) —
#  the seed script rejects any skin whose disclaimer is missing or trivially short.
#  Every disclaimer states we are NOT affiliated with the named test/company.
#
#  Item mixes vary by what each real assessment emphasises (e.g. Watson Glaser
#  is critical-reasoning heavy, Plural Strategy is numerical), all drawing from
#  the same 75-item pool — which is the whole point of the shared-pool design.
# ============================================================

skins:
