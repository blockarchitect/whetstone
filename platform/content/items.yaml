      Statement: TechCorp employs 150 people in software development.
    options:
      - { id: a, text: "True" }
      - { id: b, text: "False" }
      - { id: c, text: "Cannot Say" }
    correctOptionId: a
    explanation: >-
      Half of 300 is 150, and the passage states half work in software
      development — the statement follows directly. True.
    tags: [true-false-cannotsay]

  - id: ver-004
