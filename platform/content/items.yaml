  - id: log-001
    construct: logical
    stem: "What number continues the sequence? 2, 6, 12, 20, 30, ?"
    options:
      - { id: a, text: "36" }
      - { id: b, text: "40" }
      - { id: c, text: "42" }
      - { id: d, text: "44" }
    correctOptionId: c
    explanation: >-
      The differences grow by 2 each step: +4, +6, +8, +10, so the next gap is
      +12. 30 + 12 = 42.
    tags: [number-series]

  - id: log-002
    construct: logical
    stem: >-
      In a certain code, MONDAY is written as NPOEBZ. Using the same rule, how is
      FRIDAY written?
    options:
      - { id: a, text: "ESJEBZ" }
      - { id: b, text: "GSJDBZ" }
      - { id: c, text: "GSKEBZ" }
      - { id: d, text: "GSJEBZ" }
    correctOptionId: d
    explanation: >-
      Each letter is shifted forward by one in the alphabet (M→N, O→P, …).
      F→G, R→S, I→J, D→E, A→B, Y→Z gives GSJEBZ.
    tags: [letter-coding]

  - id: log-003
