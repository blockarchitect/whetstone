# ============================================================
#  Whetstone shared item pool
#  Original, style-based items measuring the same constructs as
#  commercial aptitude tests — never copied from any publisher (D2/D26).
#  Every item is auto-verifiable: one objectively correct option.
#
#  Pool: 75 items, 25 per construct. First 5 of each were the reviewed batch
#  (2026-07-21); the rest follow the same style, difficulty band, and keying.
#  Numerical items are text-based word problems for the MVP; table/chart
#  data-interpretation items are a later content pass (decided 2026-07-21).
#
#  id convention: {construct-prefix}-{NNN}, stable and permanent.
#  Verbal items are self-contained: the stem carries the full passage
#  + statement, so each item stands alone in the shared pool.
# ============================================================

items:
  # ---------------- NUMERICAL REASONING ----------------
  - id: num-001
    construct: numerical
    stem: >-
      A company's annual revenue was £2.4 million in 2022 and rose to
      £3.0 million in 2023. What was the percentage increase in revenue?
    options:
      - { id: a, text: "20%" }
      - { id: b, text: "25%" }
      - { id: c, text: "30%" }
      - { id: d, text: "60%" }
    correctOptionId: b
    explanation: >-
      The increase is £0.6m on a base of £2.4m. 0.6 / 2.4 = 0.25 = 25%.
      (30% would divide by the new figure; 20% and 60% are common miscalculations.)
    tags: [percentages, growth]

  - id: num-002
    construct: numerical
    stem: >-
      A train travels 240 km in 3 hours at a constant speed. Travelling at the
      same speed, how far will it go in 5 hours?
    options:
      - { id: a, text: "400 km" }
      - { id: b, text: "320 km" }
      - { id: c, text: "360 km" }
      - { id: d, text: "480 km" }
    correctOptionId: a
    explanation: >-
      Speed = 240 / 3 = 80 km/h. Distance in 5 hours = 80 × 5 = 400 km.
    tags: [rates, speed-distance-time]

  - id: num-003
    construct: numerical
    stem: >-
      A team has 60 employees. 45% of them work in sales. How many employees
      do NOT work in sales?
    options:
      - { id: a, text: "27" }
      - { id: b, text: "30" }
      - { id: c, text: "36" }
      - { id: d, text: "33" }
    correctOptionId: d
    explanation: >-
      45% of 60 = 27 work in sales. Those not in sales = 60 − 27 = 33.
      (27 is the number who DO work in sales — the common trap.)
    tags: [percentages]

  - id: num-004
    construct: numerical
    stem: >-
      A product is priced at £80. The price is first increased by 15%, then the
      new price is reduced by 15%. What is the final price?
    options:
      - { id: a, text: "£78.20" }
      - { id: b, text: "£80.00" }
      - { id: c, text: "£81.20" }
      - { id: d, text: "£82.80" }
    correctOptionId: a
    explanation: >-
      80 × 1.15 = 92, then 92 × 0.85 = 78.20. A percentage rise followed by the
      same percentage fall does not return to the original — it ends lower.
    tags: [percentages, compound]

  - id: num-005
    construct: numerical
    stem: >-
      The ratio of cats to dogs in an animal shelter is 3 : 5. If there are
      40 dogs, how many cats are there?
    options:
      - { id: a, text: "21" }
      - { id: b, text: "27" }
      - { id: c, text: "24" }
      - { id: d, text: "30" }
    correctOptionId: c
    explanation: >-
      5 parts = 40 dogs, so 1 part = 8. Cats = 3 parts = 3 × 8 = 24.
    tags: [ratios]

  - id: num-006
    construct: numerical
    stem: "A worker earns £14 per hour and works 37.5 hours per week. What is the weekly pay before deductions?"
    options:
      - { id: a, text: "£518" }
      - { id: b, text: "£525" }
      - { id: c, text: "£532" }
      - { id: d, text: "£540" }
    correctOptionId: b
    explanation: "14 × 37.5 = £525."
    tags: [multiplication]

  - id: num-007
    construct: numerical
    stem: "The average of five numbers is 18. Four of them are 12, 20, 15 and 25. What is the fifth number?"
    options:
      - { id: a, text: "16" }
      - { id: b, text: "18" }
      - { id: c, text: "20" }
      - { id: d, text: "22" }
    correctOptionId: b
    explanation: "Total = 5 × 18 = 90. The four known numbers sum to 72, so the fifth is 90 − 72 = 18."
    tags: [averages]

  - id: num-008
    construct: numerical
    stem: "After a 10% discount, a shirt costs £45. What was its original price?"
    options:
      - { id: a, text: "£48.00" }
      - { id: b, text: "£49.50" }
      - { id: c, text: "£55.00" }
      - { id: d, text: "£50.00" }
    correctOptionId: d
    explanation: "£45 is 90% of the original. Original = 45 / 0.9 = £50."
    tags: [percentages, reverse]

  - id: num-009
    construct: numerical
    stem: "A car uses 6 litres of fuel per 100 km. How much fuel does it use on a 250 km journey?"
    options:
      - { id: a, text: "15 litres" }
      - { id: b, text: "12 litres" }
      - { id: c, text: "18 litres" }
      - { id: d, text: "24 litres" }
    correctOptionId: a
    explanation: "6 litres per 100 km × 2.5 = 15 litres for 250 km."
    tags: [rates, proportion]

  - id: num-010
    construct: numerical
    stem: "8 workers build a wall in 6 days. Working at the same rate, how long would 12 workers take to build the same wall?"
    options:
      - { id: a, text: "3 days" }
      - { id: b, text: "4 days" }
      - { id: c, text: "5 days" }
      - { id: d, text: "9 days" }
    correctOptionId: b
    explanation: "The job is 8 × 6 = 48 worker-days. With 12 workers: 48 / 12 = 4 days."
    tags: [work-rate, inverse-proportion]

  - id: num-011
    construct: numerical
    stem: "£2,000 is invested at 5% simple interest per year. What is it worth after 3 years?"
    options:
      - { id: a, text: "£2,150" }
      - { id: b, text: "£2,300" }
      - { id: c, text: "£2,315" }
      - { id: d, text: "£2,600" }
    correctOptionId: b
    explanation: "Interest = 2000 × 0.05 × 3 = £300. Total = 2000 + 300 = £2,300."
    tags: [interest]

  - id: num-012
    construct: numerical
    stem: "Three-fifths of a class of 30 students are girls. How many boys are in the class?"
    options:
      - { id: a, text: "10" }
      - { id: b, text: "12" }
      - { id: c, text: "15" }
      - { id: d, text: "18" }
    correctOptionId: b
    explanation: "Girls = 3/5 × 30 = 18, so boys = 30 − 18 = 12."
    tags: [fractions]

  - id: num-013
    construct: numerical
    stem: "A recipe for 4 people needs 600 g of flour. How much flour is needed for 6 people?"
    options:
      - { id: a, text: "900 g" }
      - { id: b, text: "800 g" }
      - { id: c, text: "750 g" }
      - { id: d, text: "1,000 g" }
    correctOptionId: a
    explanation: "Per person = 600 / 4 = 150 g. For 6 people = 150 × 6 = 900 g."
    tags: [proportion]

  - id: num-014
    construct: numerical
    stem: "A phone's price falls from £600 to £480. What is the percentage decrease?"
    options:
      - { id: a, text: "12%" }
      - { id: b, text: "18%" }
      - { id: c, text: "25%" }
      - { id: d, text: "20%" }
    correctOptionId: d
    explanation: "Decrease = £120 on a base of £600. 120 / 600 = 0.20 = 20%."
    tags: [percentages]

  - id: num-015
    construct: numerical
    stem: "Two items cost £150 in total. One costs twice as much as the other. What is the price of the cheaper item?"
    options:
      - { id: a, text: "£50" }
      - { id: b, text: "£60" }
      - { id: c, text: "£75" }
      - { id: d, text: "£100" }
    correctOptionId: a
    explanation: "If the cheaper is x, then x + 2x = 150, so 3x = 150 and x = £50."
    tags: [algebra]

  - id: num-016
    construct: numerical
    stem: "A tank holds 240 litres and fills at a steady 8 litres per minute. How long does it take to fill?"
    options:
      - { id: a, text: "24 minutes" }
      - { id: b, text: "28 minutes" }
      - { id: c, text: "30 minutes" }
      - { id: d, text: "32 minutes" }
    correctOptionId: c
    explanation: "240 / 8 = 30 minutes."
    tags: [rates]

  - id: num-017
    construct: numerical
    stem: "Monthly sales rose from 320 units to 400 units. What was the percentage increase?"
    options:
      - { id: a, text: "20%" }
      - { id: b, text: "30%" }
      - { id: c, text: "80%" }
      - { id: d, text: "25%" }
    correctOptionId: d
    explanation: "Increase = 80 units on a base of 320. 80 / 320 = 0.25 = 25%."
    tags: [percentages]

  - id: num-018
    construct: numerical
    stem: "On a map, the scale is 1 cm to 5 km. Two towns are 8 cm apart on the map. What is the actual distance between them?"
    options:
      - { id: a, text: "13 km" }
      - { id: b, text: "35 km" }
      - { id: c, text: "40 km" }
      - { id: d, text: "45 km" }
    correctOptionId: c
    explanation: "8 cm × 5 km per cm = 40 km."
    tags: [scale, proportion]

  - id: num-019
    construct: numerical
    stem: "A worker completes 4 tasks per hour. How many tasks are completed in a 7.5-hour shift?"
    options:
      - { id: a, text: "26" }
      - { id: b, text: "28" }
      - { id: c, text: "30" }
      - { id: d, text: "32" }
    correctOptionId: c
    explanation: "4 × 7.5 = 30 tasks."
    tags: [rates]

  - id: num-020
    construct: numerical
    stem: "40% of a number is 60. What is the number?"
    options:
      - { id: a, text: "100" }
      - { id: b, text: "120" }
      - { id: c, text: "240" }
      - { id: d, text: "150" }
    correctOptionId: d
    explanation: "Number = 60 / 0.40 = 150."
    tags: [percentages, reverse]

  - id: num-021
    construct: numerical
    stem: "A company's profit margin is 20% of revenue. If revenue is £50,000, what is the profit?"
    options:
      - { id: a, text: "£8,000" }
      - { id: b, text: "£12,000" }
      - { id: c, text: "£40,000" }
      - { id: d, text: "£10,000" }
    correctOptionId: d
    explanation: "20% of £50,000 = £10,000."
    tags: [percentages]

  - id: num-022
    construct: numerical
    stem: "A journey of 180 km takes 2.5 hours. What is the average speed?"
    options:
      - { id: a, text: "72 km/h" }
      - { id: b, text: "70 km/h" }
      - { id: c, text: "68 km/h" }
      - { id: d, text: "75 km/h" }
    correctOptionId: a
    explanation: "Speed = distance / time = 180 / 2.5 = 72 km/h."
    tags: [speed-distance-time]

  - id: num-023
    construct: numerical
    stem: "£120 is shared between A and B in the ratio 2 : 3. How much does B receive?"
    options:
      - { id: a, text: "£48" }
      - { id: b, text: "£60" }
      - { id: c, text: "£72" }
      - { id: d, text: "£80" }
    correctOptionId: c
    explanation: "There are 5 parts. 1 part = 120 / 5 = £24. B gets 3 parts = £72."
    tags: [ratios]

  - id: num-024
    construct: numerical
    stem: "A product sells for £75, which represents a 25% profit on its cost. What was the cost?"
    options:
      - { id: a, text: "£56.25" }
      - { id: b, text: "£62.50" }
      - { id: c, text: "£60.00" }
      - { id: d, text: "£100.00" }
    correctOptionId: c
    explanation: "Selling price = cost × 1.25, so cost = 75 / 1.25 = £60."
    tags: [percentages, reverse, profit]

  - id: num-025
    construct: numerical
    stem: "If 5 identical pens cost £3.75, how much do 8 of the same pens cost?"
    options:
      - { id: a, text: "£5.50" }
      - { id: b, text: "£6.00" }
      - { id: c, text: "£6.25" }
      - { id: d, text: "£6.75" }
    correctOptionId: b
    explanation: "One pen = 3.75 / 5 = £0.75. Eight pens = 0.75 × 8 = £6.00."
    tags: [unit-rate]

  # ---------------- VERBAL REASONING ----------------
  # Format: read the passage, then judge the statement — True (follows from the
  # passage), False (contradicts it), or Cannot Say (undetermined from the passage).
  - id: ver-001
    construct: verbal
    stem: >-
      Passage: The Riverside Café opened in 2015 and quickly became popular with
      local office workers. It serves breakfast and lunch, but closes at 3pm each
      day. All of its coffee beans are sourced from a single farm in Colombia.


      Statement: The Riverside Café serves dinner.
    options:
      - { id: a, text: "True" }
      - { id: b, text: "False" }
      - { id: c, text: "Cannot Say" }
    correctOptionId: b
    explanation: >-
      The passage states the café serves breakfast and lunch and closes at 3pm.
      Dinner service is therefore contradicted by the passage — False.
    tags: [true-false-cannotsay]

  - id: ver-002
    construct: verbal
    stem: >-
      Passage: The Riverside Café opened in 2015 and quickly became popular with
      local office workers. It serves breakfast and lunch, but closes at 3pm each
      day. All of its coffee beans are sourced from a single farm in Colombia.


      Statement: The Riverside Café is the most popular café in its town.
    options:
      - { id: a, text: "True" }
      - { id: b, text: "False" }
      - { id: c, text: "Cannot Say" }
    correctOptionId: c
    explanation: >-
      The passage says the café is popular with local office workers, but says
      nothing comparing it to other cafés. Its relative ranking cannot be
      determined — Cannot Say.
    tags: [true-false-cannotsay]

  - id: ver-003
    construct: verbal
    stem: >-
      Passage: TechCorp launched its flagship app in March. The company employs
