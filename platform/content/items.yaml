      - { id: d, text: "No Bloops are Lazzies" }
    correctOptionId: a
    explanation: >-
      Bloops ⊆ Razzies ⊆ Lazzies, so every Bloop is a Lazzie. The other options
      make claims the premises do not guarantee.
    tags: [syllogism, deduction]

